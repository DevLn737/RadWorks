[gameplay]
	#Master switch for RadWorks beta gameplay behavior.
	enabled = true
	#When true, server-side exposure checks can apply radworks:radiation.
	autoApplyEffect = true
	#Minimum diagnostic exposure required for beta effect auto-application.
	# Default: 10.0
	# Range: 0.0 ~ 1000000.0
	exposureThreshold = 10.0
	#Duration for automatically applied radworks:radiation.
	# Default: 120
	# Range: 1 ~ 72000
	effectDurationTicks = 120
	#Per-player server tick interval between exposure scans.
	# Default: 40
	# Range: 1 ~ 12000
	scanIntervalTicks = 40
	#Reserved for POST_BETA. Damage is not implemented in beta.
	damageEnabled = false
